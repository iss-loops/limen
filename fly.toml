# Alternativa a Railway: deploy en Fly.io.
#   1) instala flyctl   2) flyctl auth login   3) flyctl launch --copy-config --now
app = "limen-demo"
primary_region = "mia"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[env]
  PORT = "8080"
